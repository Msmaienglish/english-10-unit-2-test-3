<script>
const QUESTIONS=[{"n":1,"section":1,"stem":"Question 1:","options":{"A":"concern","B":"concerned","C":"concerning","D":"concerns"},"correct":"D","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>concern</b> (n, singular/uncountable): mối lo; số ít không hòa hợp với <i>have led</i>.</li><li><b>B.</b> <b>concerned</b> (adj): lo lắng; không thể làm danh từ trung tâm sau <i>environmental</i> ở đây.</li><li><b>C.</b> <b>concerning</b> (prep/adj): liên quan đến / đáng lo; sai từ loại.</li><li><b>D.</b> <b>concerns</b> (n, plural): những mối lo ngại; hòa hợp với động từ số nhiều <i>have led</i>.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Tuy nhiên, những mối lo ngại về môi trường ngày càng tăng đã khiến nhiều người đặt câu hỏi liệu các sản phẩm này có nên bị cấm hoàn toàn hay không.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Ngay sau chỗ trống là <b>have led</b> → chủ ngữ phải là danh từ số nhiều.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn D?</b><p><b>environmental concerns</b> là collocation tự nhiên và số nhiều phù hợp với <i>have led</i>.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Nếu dùng số ít phải là <i>concern has led</i>.</li><li><b>B.</b> Tính từ.</li><li><b>C.</b> Không phải danh từ số nhiều.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Chú ý hòa hợp chủ ngữ–động từ: <b>plural noun + have</b>. Collocation: <b>environmental concerns</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: D. concerns</div>"},{"n":2,"section":1,"stem":"Question 2:","options":{"A":"reducing","B":"reduce","C":"to reduce","D":"reduced"},"correct":"A","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>reducing</b>: V-ing, dùng sau <i>suggest</i> khi không có tân ngữ + that-clause.</li><li><b>B.</b> <b>reduce</b>: nguyên mẫu không dùng trực tiếp sau <i>suggest</i>.</li><li><b>C.</b> <b>to reduce</b>: không dùng cấu trúc <i>suggest to V</i>.</li><li><b>D.</b> <b>reduced</b>: V2/V3, không phù hợp.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Các nhóm môi trường đề xuất giảm việc sử dụng các sản phẩm dùng một lần bất cứ khi nào có thể.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Cấu trúc chuẩn: <b>suggest + V-ing</b>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn A?</b><p><b>suggest reducing</b> đúng ngữ pháp và đúng nghĩa.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>B.</b> Thiếu -ing.</li><li><b>C.</b> Không có cấu trúc <i>suggest to reduce</i>.</li><li><b>D.</b> Sai dạng động từ.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Nhớ: <b>suggest doing sth</b> hoặc <b>suggest that S (should) V</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: A. reducing</div>"},{"n":3,"section":1,"stem":"Question 3:","options":{"A":"on","B":"at","C":"to","D":"for"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>on</b>: trên/về; không đi với <i>lead</i> trong cấu trúc này.</li><li><b>B.</b> <b>at</b>: tại; sai collocation.</li><li><b>C.</b> <b>to</b>: tạo cụm <i>lead to</i> = dẫn đến.</li><li><b>D.</b> <b>for</b>: cho/vì; sai collocation.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Rác nhựa thường kết thúc ở các khu vực tự nhiên, dẫn đến thiệt hại nghiêm trọng cho động vật hoang dã.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Cụm cố định <b>lead to + noun</b>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p><b>leading to serious damage</b> là cấu trúc chuẩn.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Không nói <i>lead on damage</i>.</li><li><b>B.</b> Không nói <i>lead at damage</i>.</li><li><b>D.</b> Không nói <i>lead for damage</i>.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p><b>lead to + N/V-ing</b> = dẫn đến.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. to</div>"},{"n":4,"section":1,"stem":"Question 4:","options":{"A":"sustainable","B":"most sustainable","C":"more sustainable","D":"the most sustainable"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>sustainable</b>: bền vững; dạng nguyên cấp, không phù hợp khi có <i>than</i>.</li><li><b>B.</b> <b>most sustainable</b>: so sánh nhất nhưng thiếu <i>the</i> và không đi với <i>than</i>.</li><li><b>C.</b> <b>more sustainable</b>: so sánh hơn, đúng với <i>than</i>.</li><li><b>D.</b> <b>the most sustainable</b>: so sánh nhất.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Chính phủ có thể khuyến khích sử dụng những sản phẩm bền vững hơn nhựa dùng một lần.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Từ khóa <b>than</b> → cần so sánh hơn.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>Tính từ dài <i>sustainable</i> dùng <b>more + adjective</b>.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Thiếu so sánh hơn.</li><li><b>B.</b> Sai cấp so sánh.</li><li><b>D.</b> So sánh nhất không đi với <i>than</i> như vậy.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Tính từ dài: <b>more + adj + than</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. more sustainable</div>"},{"n":5,"section":1,"stem":"Question 5:","options":{"A":"gain","B":"take","C":"receive","D":"place"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>gain responsibility</b>: không phải collocation tự nhiên trong nghĩa ‘nhận trách nhiệm’.</li><li><b>B.</b> <b>take responsibility</b>: chịu/nhận trách nhiệm.</li><li><b>C.</b> <b>receive responsibility</b>: không tự nhiên.</li><li><b>D.</b> <b>place responsibility</b>: thường là <i>place responsibility on someone</i>, tức đặt trách nhiệm lên ai.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Thay vào đó, cả chính phủ và người dân nên chịu trách nhiệm về việc giảm rác thải.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Cụm cố định <b>take responsibility for + N/V-ing</b>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p>B là collocation chuẩn.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Không tự nhiên.</li><li><b>C.</b> Không tự nhiên.</li><li><b>D.</b> Khác nghĩa và cần cấu trúc khác.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p><b>take responsibility for</b> = chịu trách nhiệm về.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. take</div>"},{"n":6,"section":1,"stem":"Question 6:","options":{"A":"whose","B":"where","C":"who","D":"which"},"correct":"D","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>whose</b>: chỉ sở hữu và cần danh từ theo sau.</li><li><b>B.</b> <b>where</b>: chỉ nơi chốn.</li><li><b>C.</b> <b>who</b>: chỉ người.</li><li><b>D.</b> <b>which</b>: đại từ quan hệ chỉ vật/sự việc, làm chủ ngữ của <i>aim</i>.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Các giải pháp dài hạn được hỗ trợ bởi những chiến dịch nhằm giảm rác nhựa có thể tạo ra thay đổi lâu dài.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Antecedent là <b>campaigns</b> (sự vật/sự việc), sau chỗ trống là động từ <b>aim</b>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn D?</b><p><b>campaigns which aim...</b> đúng mệnh đề quan hệ.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Không có ý sở hữu.</li><li><b>B.</b> Campaigns không phải nơi chốn.</li><li><b>C.</b> Không dùng cho chiến dịch.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Vật/sự việc + <b>which/that + V</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: D. which</div>"},{"n":7,"section":2,"stem":"Question 7:","options":{"A":"Although","B":"Since","C":"Unless","D":"If"},"correct":"D","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>Although</b>: mặc dù, cần quan hệ nhượng bộ.</li><li><b>B.</b> <b>Since</b>: bởi vì/kể từ khi; không phù hợp với dự đoán điều kiện.</li><li><b>C.</b> <b>Unless</b>: trừ khi, mang nghĩa phủ định điều kiện.</li><li><b>D.</b> <b>If</b>: nếu; phù hợp câu điều kiện loại 1.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Nếu số lượng du khách tiếp tục tăng với tốc độ hiện tại, các khu vực tự nhiên cuối cùng sẽ chịu áp lực môi trường nghiêm trọng.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Vế chính có <b>will eventually experience</b> → cấu trúc điều kiện thực ở tương lai.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn D?</b><p><b>If + present simple, will + V</b> đúng.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Không có đối lập.</li><li><b>B.</b> Không phải nguyên nhân chắc chắn.</li><li><b>C.</b> Sẽ đảo nghĩa câu.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Câu điều kiện loại 1: <b>If + S + V(s/es), S + will + V</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: D. If</div>"},{"n":8,"section":2,"stem":"Question 8:","options":{"A":"control","B":"controlled","C":"have controlled","D":"to control"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>control</b>: hiện tại/nguyên mẫu.</li><li><b>B.</b> <b>controlled</b>: quá khứ đơn, dùng trong cấu trúc giả định sau <i>It is high time</i>.</li><li><b>C.</b> <b>have controlled</b>: hiện tại hoàn thành, không dùng ở đây.</li><li><b>D.</b> <b>to control</b>: to-infinitive.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Đã đến lúc chính quyền địa phương kiểm soát số lượng du khách trước khi tiếng ồn, rác và quá tải gây hại môi trường sống.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Cấu trúc đặc biệt <b>It is high time + S + past simple</b> diễn tả việc đáng lẽ nên làm ngay.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p><b>controlled</b> là đáp án ngữ pháp chuẩn.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Không dùng present simple sau <i>high time</i> trong mẫu này.</li><li><b>C.</b> Sai cấu trúc.</li><li><b>D.</b> Sai cấu trúc.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p><b>It is (high) time + S + V2/ed</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. controlled</div>"},{"n":9,"section":2,"stem":"Question 9:","options":{"A":"enter","B":"are entering","C":"entered","D":"was entering"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>enter</b>: chủ động; protected areas không tự ‘đi vào’.</li><li><b>B.</b> <b>are entering</b>: chủ động tiếp diễn, sai vai nghĩa.</li><li><b>C.</b> <b>entered</b>: V3 trong bị động <i>are sometimes entered by...</i>.</li><li><b>D.</b> <b>was entering</b>: chủ động quá khứ tiếp diễn và sai số.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Trong bốn nhóm du lịch, hai nhóm tuân thủ hướng dẫn môi trường cẩn thận, trong khi các khu vực được bảo vệ đôi khi bị những nhóm còn lại đi vào.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Trước chỗ trống đã có <b>are sometimes</b> và sau có <b>by the others</b> → bị động.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>Cần <b>V3 = entered</b>.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Thiếu dạng bị động.</li><li><b>B.</b> Chủ động.</li><li><b>D.</b> Sai thì, sai voice và số.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Bị động hiện tại đơn: <b>am/is/are + V3</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. entered</div>"},{"n":10,"section":2,"stem":"Question 10:","options":{"A":"put away","B":"look into","C":"get over","D":"run out of"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>put away</b>: cất đi.</li><li><b>B.</b> <b>look into</b>: xem xét/điều tra kỹ.</li><li><b>C.</b> <b>get over</b>: vượt qua/hồi phục.</li><li><b>D.</b> <b>run out of</b>: hết/cạn.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Họ cũng xem xét các khiếu nại về hoạt động du lịch trước khi đưa ra quy định mới.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Tân ngữ <b>complaints</b> phù hợp với hành động xem xét/điều tra.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p><b>look into complaints</b> là collocation tự nhiên.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Không thể ‘cất khiếu nại đi’ theo nghĩa cần.</li><li><b>C.</b> Không phải ‘vượt qua khiếu nại’.</li><li><b>D.</b> Không thể ‘hết khiếu nại’ ở đây.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p><b>look into a problem/complaint</b> = xem xét kỹ.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. look into</div>"},{"n":11,"section":2,"stem":"Question 11:","options":{"A":"appliances","B":"habitats","C":"devices","D":"schedules"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>appliances</b>: thiết bị gia dụng.</li><li><b>B.</b> <b>habitats</b>: môi trường sống.</li><li><b>C.</b> <b>devices</b>: thiết bị.</li><li><b>D.</b> <b>schedules</b>: lịch trình.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Các chương trình giáo dục và giới hạn du khách có thể giúp bảo vệ những môi trường sống tự nhiên nơi động vật sống và thực vật phát triển.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Mệnh đề <b>where animals live and plants grow</b> chính là định nghĩa của habitat.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p><b>natural habitats</b> đúng nghĩa.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Không phải nơi sinh vật sống.</li><li><b>C.</b> Không phù hợp.</li><li><b>D.</b> Không phù hợp.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p><b>habitat</b> = natural home/environment of an animal or plant.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. habitats</div>"},{"n":12,"section":2,"stem":"Question 12:","options":{"A":"protection","B":"exploration","C":"development","D":"recreation"},"correct":"A","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>protection</b>: sự bảo vệ.</li><li><b>B.</b> <b>exploration</b>: sự khám phá.</li><li><b>C.</b> <b>development</b>: sự phát triển.</li><li><b>D.</b> <b>recreation</b>: hoạt động giải trí.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Trong tương lai, du lịch sinh thái chỉ có thể thành công nếu du khách có cam kết mạnh mẽ hơn đối với việc bảo vệ môi trường.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Cụm tự nhiên <b>commitment to environmental protection</b>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn A?</b><p>A phù hợp cả ngữ nghĩa lẫn collocation.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>B.</b> Khám phá môi trường không phải mục tiêu bảo tồn.</li><li><b>C.</b> Có thể liên quan nhưng không đúng trọng tâm.</li><li><b>D.</b> Không phù hợp.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Collocation: <b>environmental protection</b> = bảo vệ môi trường.</p></div>\n<div class=\"answer-line\">Đáp án đúng: A. protection</div>"},{"n":13,"section":3,"stem":"<div class=\"arrange-bank\">\n<p><b>a.</b> Ava: Maybe the app can guide buses around busy streets, so fewer engines wait and emit smoke near the school.</p>\n<p><b>b.</b> Ben: The air outside our gate was bad again because cars waited at the lights for nearly twenty minutes.</p>\n<p><b>c.</b> Ben: That sounds useful. I’ll mention it in our smart city presentation and add a photo of the traffic jam.</p>\n</div>","options":{"A":"a – b – c","B":"c – a – b","C":"b – a – c","D":"b – c – a"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> a đưa giải pháp trước khi b nêu vấn đề tắc xe.</li><li><b>B.</b> c mở bằng <i>That sounds useful</i> nhưng chưa có đề xuất nào.</li><li><b>C.</b> b nêu vấn đề → a gợi ý app điều hướng xe → c phản hồi trực tiếp đề xuất.</li><li><b>D.</b> c khen ‘useful’ trước khi a đưa giải pháp.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>Ben nói không khí trước cổng trường xấu vì xe chờ đèn lâu; Ava gợi ý ứng dụng điều hướng xe buýt; Ben thấy hữu ích và sẽ đưa vào bài thuyết trình.</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p><i>That sounds useful</i> ở c phải quy chiếu đề xuất a; a phải xuất hiện sau vấn đề b.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>C có mạch vấn đề → giải pháp → phản hồi.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Giải pháp xuất hiện trước vấn đề.</li><li><b>B.</b> Thiếu tiền đề cho <i>That</i>.</li><li><b>D.</b> Phản hồi đứng trước đề xuất.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Hội thoại thường theo <b>problem → suggestion → response</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. b – a – c</div>"},{"n":14,"section":3,"stem":"<div class=\"arrange-bank\">\n<p><b>a.</b> Emma: Then students could send clear photos after school, so the team knows which spots need attention.</p>\n<p><b>b.</b> Liam: Good plan. It combines technology with local help, not just screens.</p>\n<p><b>c.</b> Liam: Our neighbourhood app shows which bins are full, but some residents still leave rubbish beside them when collection is late.</p>\n<p><b>d.</b> Emma: Are the collection teams checking the app every morning before they choose their route?</p>\n<p><b>e.</b> Liam: Yes, but the map updates slowly when the mobile signal is weak near the river.</p>\n</div>","options":{"A":"c – d – e – a – b","B":"c – a – b – d – e","C":"d – e – c – a – b","D":"b – c – d – e – a"},"correct":"A","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> c nêu vấn đề → d hỏi về cách đội thu gom dùng app → e trả lời và nêu điểm yếu cập nhật → a đưa giải pháp bổ sung bằng ảnh → b đánh giá ‘Good plan’.</li><li><b>B.</b> a đưa giải pháp trước khi d/e làm rõ vấn đề cập nhật chậm.</li><li><b>C.</b> d mở bằng câu hỏi về <i>the app</i> trước khi c giới thiệu app.</li><li><b>D.</b> b mở bằng <i>Good plan</i> nhưng chưa có kế hoạch.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>Liam mô tả app và vấn đề rác; Emma hỏi đội thu gom có xem app không; Liam nói có nhưng bản đồ cập nhật chậm; Emma đề xuất học sinh gửi ảnh; Liam đồng ý.</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Cặp <b>Are...? → Yes...</b> nối d–e; <b>Then</b> ở a dựa trên vấn đề e; <b>Good plan</b> ở b kết.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn A?</b><p>A giữ đúng lượt hỏi–đáp và mạch giải pháp.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>B.</b> Giải pháp quá sớm.</li><li><b>C.</b> Thiếu tiền đề cho app.</li><li><b>D.</b> Câu kết bị đặt đầu.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Theo dõi từ nối <b>Then</b>, câu hỏi–trả lời và các đại từ quy chiếu.</p></div>\n<div class=\"answer-line\">Đáp án đúng: A. c – d – e – a – b</div>"},{"n":15,"section":3,"stem":"<div class=\"arrange-bank\">\n<p>Dear students,<br>I hope you are having a good week.</p>\n<p><b>a.</b> Before the visit, please bring your notebook and prepare one thoughtful question about greener transport.</p>\n<p><b>b.</b> Engineers there will show us how street lamps become dimmer when roads are empty.</p>\n<p><b>c.</b> Our class will visit the city control room next Thursday to learn how smart lights save electricity.</p>\n<p><b>d.</b> Your short notes will be used for a simple group poster after the trip, so please listen carefully.</p>\n<p><b>e.</b> They will also explain how sensors help buses arrive on time and reduce emissions.</p>\n<p>Best regards,<br>Ms Brown</p>\n</div>","options":{"A":"c – a – b – e – d","B":"c – b – a – e – d","C":"a – c – b – d – e","D":"b – a – c – e – d"},"correct":"A","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> c giới thiệu chuyến đi → a hướng dẫn chuẩn bị trước chuyến đi → b/e mô tả hoạt động tại đó → d nêu nhiệm vụ sau chuyến đi.</li><li><b>B.</b> b bắt đầu phần ‘during visit’ trước khi a quay lại <i>Before the visit</i>, trình tự thời gian kém mượt.</li><li><b>C.</b> a nói <i>the visit</i> trước khi c giới thiệu chuyến đi.</li><li><b>D.</b> b nói <i>there</i> khi chưa biết nơi nào.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>Ms Brown thông báo chuyến tham quan phòng điều khiển, yêu cầu học sinh chuẩn bị, cho biết kỹ sư sẽ trình bày gì và cách dùng ghi chú sau chuyến đi.</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Dấu hiệu thời gian và quy chiếu: <b>visit → Before the visit → there → also → after the trip</b>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn A?</b><p>A có trình tự rõ nhất.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>B.</b> Đảo phần chuẩn bị với hoạt động.</li><li><b>C.</b> Thiếu tiền đề cho <i>the visit</i>.</li><li><b>D.</b> Thiếu tiền đề cho <i>there</i>.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Email sự kiện: <b>introduce event → preparation → during-event details → follow-up</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: A. c – a – b – e – d</div>"},{"n":16,"section":3,"stem":"<div class=\"arrange-bank\">\n<p><b>a.</b> Some older residents worried the path would feel unsafe, so volunteers tested the lights with them after dinner.</p>\n<p><b>b.</b> Last month, the lights in River Park stayed on all night, even when no one used the path after ten.</p>\n<p><b>c.</b> By the end of the month, the new system kept the park bright when needed and reduced the energy bill.</p>\n<p><b>d.</b> This wasted electricity, and neighbours complained that the city should spend the money on safer crossings instead.</p>\n<p><b>e.</b> The council installed small sensors that made the lamps brighter only when walkers or bikes passed.</p>\n</div>","options":{"A":"b – e – d – c – a","B":"d – b – e – c – a","C":"b – d – e – a – c","D":"a – b – d – c – e"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> e giải pháp trước d mô tả hậu quả; a nỗi lo an toàn bị đặt sau kết quả c.</li><li><b>B.</b> d mở bằng <i>This wasted electricity</i> khi chưa có ‘This’ để quy chiếu.</li><li><b>C.</b> b nêu đèn bật cả đêm → d ‘This’ chỉ sự lãng phí → e lắp cảm biến → a kiểm tra lo ngại an toàn → c kết quả cuối tháng.</li><li><b>D.</b> a mở bằng lo ngại về ‘the path’ trước khi nêu vấn đề; e giải pháp lại đứng sau kết quả.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>Đèn công viên bật cả đêm gây lãng phí; hội đồng lắp cảm biến; tình nguyện viên kiểm tra cùng người dân lo ngại an toàn; cuối tháng hệ thống vừa đủ sáng vừa giảm hóa đơn.</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p><b>This</b> ở d phải theo b; <b>By the end of the month</b> ở c là kết quả cuối.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>C đúng mạch vấn đề → hậu quả → giải pháp → kiểm chứng → kết quả.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Sai trật tự nguyên nhân–giải pháp.</li><li><b>B.</b> Đại từ quy chiếu sai.</li><li><b>D.</b> Kết quả trước giải pháp.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Văn kể sự việc: <b>problem → consequence → solution → concern/test → result</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. b – d – e – a – c</div>"},{"n":17,"section":3,"stem":"<div class=\"arrange-bank\">\n<p><b>a.</b> A student transport club proposed a simple app that showed live bus arrivals, seat space, and safer walking paths to nearby stops.</p>\n<p><b>b.</b> The first month of reports proved that better information helped, but it also exposed older buses and uncovered waiting areas as real barriers.</p>\n<p><b>c.</b> Morning travel around Lakeside School had become messy, with late smoky buses, packed motorbike lanes, and students waiting too close to the road.</p>\n<p><b>d.</b> The council responded by changing the timetable, replacing the worst buses, and building a shaded stop outside the school gate.</p>\n<p><b>e.</b> By the end of term, more families trusted the bus route, and the street before lessons was quieter than it had been for months.</p>\n</div>","options":{"A":"c – a – e – d – b","B":"a – c – b – d – e","C":"c – a – b – d – e","D":"c – d – b – a – e"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> e kết quả cuối kỳ xuất hiện trước d phản ứng của council và b báo cáo tháng đầu.</li><li><b>B.</b> a giải pháp xuất hiện trước c nêu vấn đề giao thông.</li><li><b>C.</b> c vấn đề → a app được đề xuất → b báo cáo cho thấy app giúp nhưng lộ thêm rào cản → d council xử lý → e kết quả cuối kỳ.</li><li><b>D.</b> d council phản ứng trước khi b có báo cáo và trước a app.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>Giao thông quanh trường lộn xộn; câu lạc bộ đề xuất app; báo cáo ban đầu cho thấy cả lợi ích và vấn đề sâu hơn; hội đồng cải thiện dịch vụ; cuối kỳ tình hình tốt hơn.</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Mốc <b>first month → council responded → by the end of term</b> xác định b–d–e; trước đó phải là c–a.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>C là chuỗi logic và thời gian hoàn chỉnh.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Đảo kết quả và nguyên nhân.</li><li><b>B.</b> Giải pháp trước vấn đề.</li><li><b>D.</b> Phản ứng trước dữ liệu.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Nhìn mốc thời gian và quan hệ <b>problem → initiative → findings → response → outcome</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. c – a – b – d – e</div>"},{"n":18,"section":4,"stem":"Question 18:","options":{"A":"make a quick choice and see it as an eco-friendly bargain","B":"making a quick choice and seeing it as an eco-friendly bargain","C":"to make a quick choice and see it as an eco-friendly bargain","D":"a quick choice which sees it as an eco-friendly bargain"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> Sau <i>lead to</i> không dùng nguyên mẫu không -ing theo nghĩa này.</li><li><b>B.</b> <b>making... and seeing...</b>: hai gerund song song sau giới từ <i>to</i> trong phrasal verb <i>lead to</i>.</li><li><b>C.</b> <i>to</i> ở <i>lead to</i> là giới từ, không phải dấu hiệu to-infinitive.</li><li><b>D.</b> Sai logic: ‘a quick choice’ không thể tự <i>see</i> món đồ là bargain.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Khi một chiếc áo mới rẻ hơn bữa trưa, giá thấp có thể dẫn đến việc người mua đưa ra lựa chọn nhanh và xem nó như một món hời thân thiện với môi trường.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Cấu trúc <b>lead to + noun/V-ing</b>; hai hành động cần song song.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p>B có <b>making</b> và <b>seeing</b> đều là V-ing.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Sai sau giới từ <i>to</i>.</li><li><b>C.</b> Nhầm <i>to</i> với infinitive marker.</li><li><b>D.</b> Sai logic chủ thể.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p><b>lead to doing sth</b>; parallelism: <b>making ... and seeing ...</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. making a quick choice and seeing it as an eco-friendly bargain</div>"},{"n":19,"section":4,"stem":"Question 19:","options":{"A":"with tiny fibres can break down into them when washed repeatedly","B":"which can break down into tiny fibres when washed repeatedly","C":"whose repeated washing can break down into rivers and oceans","D":"and can be broken down as tiny fibres during repeated washing"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> Sau <i>with</i> cấu trúc này sai; đồng thời <i>them</i> không có tiền đề rõ.</li><li><b>B.</b> <b>which</b> thay cho synthetic materials; <i>can break down into tiny fibres</i> đúng ngữ pháp và nghĩa.</li><li><b>C.</b> <i>whose repeated washing</i> không hợp nghĩa; vật liệu không ‘break down into rivers’.</li><li><b>D.</b> <i>be broken down as tiny fibres</i> dùng giới từ sai và chuyển nghĩa thành bị động không tự nhiên.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Nhiều quần áo giá rẻ được làm từ vật liệu tổng hợp, những vật liệu này có thể phân rã thành các sợi cực nhỏ khi được giặt lặp lại.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Chỗ trống sau dấu phẩy cần mệnh đề quan hệ bổ nghĩa cho <b>synthetic materials</b>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p><b>which can break down...</b> đúng chủ ngữ, modal và ý nghĩa.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Sai cấu trúc.</li><li><b>C.</b> Sai quan hệ sở hữu và sai nghĩa.</li><li><b>D.</b> Sai collocation/voice.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Mệnh đề quan hệ không xác định: <b>, which + verb ...</b></p></div>\n<div class=\"answer-line\">Đáp án đúng: B. which can break down into tiny fibres when washed repeatedly</div>"},{"n":20,"section":4,"stem":"Question 20:","options":{"A":"Beyond the price tag, little environmental impact remains to consider","B":"The price tag therefore shows how eco-friendly production has become","C":"Beyond the price tag, much of the environmental impact remains hidden","D":"The low price mainly proves that emissions and waste have been reduced"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> Nói <i>little environmental impact</i> còn lại để xem xét, trái đoạn vừa liệt kê nhiều chi phí ẩn.</li><li><b>B.</b> Giá thấp không chứng minh sản xuất eco-friendly.</li><li><b>C.</b> Đúng: nhiều tác động môi trường nằm ngoài giá niêm yết và bị ẩn.</li><li><b>D.</b> Trái ý; giá thấp không chứng minh emissions/waste giảm.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Ngoài con số trên nhãn giá, phần lớn tác động môi trường vẫn bị che khuất.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Các câu trước liệt kê water, energy, chemicals, labour đã được sử dụng nhưng không phản ánh trong giá.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>C tóm đúng ‘hidden costs’ của fast fashion.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Đảo ngược mức độ tác động.</li><li><b>B.</b> Suy luận sai.</li><li><b>D.</b> Suy luận sai và trái bài.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p>Khi chọn câu nối đoạn, kiểm tra câu nào khái quát chính xác các bằng chứng ngay trước đó.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. Beyond the price tag, much of the environmental impact remains hidden</div>"},{"n":21,"section":4,"stem":"Question 21:","options":{"A":"so shoppers often rely on visible style and discounts to make choices","B":"because style and discounts raise awareness of these hidden impacts","C":"while these hidden impacts are displayed through style and discounts","D":"instead of visible style and discounts being used to make choices"},"correct":"A","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> <b>so</b> nêu hệ quả hợp lý: vì tác động ẩn không nhìn thấy nên người mua dựa vào style/discount dễ thấy.</li><li><b>B.</b> Sai: style/discount không làm người mua nhận thức tác động ẩn.</li><li><b>C.</b> Trái câu trước: hidden impacts không được hiển thị qua style/discount.</li><li><b>D.</b> Cấu trúc rườm rà và không tạo logic câu.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Chúng ta không thể thấy nước thải, khí thải hay rác dệt may..., vì vậy người mua thường dựa vào kiểu dáng và giảm giá dễ nhìn để đưa ra lựa chọn.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Câu đầu đoạn nói <b>what we can see</b> là evidence dễ nhất; sau đó liệt kê những gì <b>cannot see</b>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn A?</b><p>A nối đúng quan hệ nguyên nhân–hệ quả.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>B.</b> Đảo nghĩa.</li><li><b>C.</b> Trái nghĩa ‘cannot see’.</li><li><b>D.</b> Không hoàn chỉnh mạch logic.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p><b>so</b> = vì vậy, dùng khi câu sau là hệ quả của câu trước.</p></div>\n<div class=\"answer-line\">Đáp án đúng: A. so shoppers often rely on visible style and discounts to make choices</div>"},{"n":22,"section":4,"stem":"Question 22:","options":{"A":"not judging cheap clothing only by price but considering its environmental impact","B":"not to judge cheap clothing only by price but to consider its environmental impact","C":"not judge cheap clothing only by price but consider its environmental impact","D":"to avoid judging cheap clothing only by price but consider its environmental impact"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích từ vựng / cấu trúc 4 đáp án</b><ul><li><b>A.</b> Sau <i>be careful</i> để diễn tả lời khuyên hành động, dạng chuẩn là <i>be careful not to + V</i>; phương án A thiếu <i>to</i>.</li><li><b>B.</b> <b>not to judge ... but to consider ...</b>: đúng cấu trúc và song song.</li><li><b>C.</b> Thiếu <i>to</i> sau <i>be careful</i>.</li><li><b>D.</b> <i>to avoid judging ... but consider</i> không song song: judging ↔ consider.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch nghĩa toàn câu / ngữ cảnh</b><p>“Vì vậy, người tiêu dùng nên cẩn thận không đánh giá quần áo rẻ chỉ bằng giá, mà phải cân nhắc tác động môi trường của nó.”</p></div>\n<div class=\"ex-step\"><b>3. Từ khóa hoặc dấu hiệu</b><p>Trước chỗ trống là <b>be careful</b>; cấu trúc tự nhiên <b>be careful not to do A but to do B</b>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p>B giữ parallelism <i>to judge / to consider</i>.</p></div>\n<div class=\"ex-step\"><b>5. Tại sao không chọn các đáp án còn lại?</b><ul><li><b>A.</b> Sai mẫu sau <i>careful</i>.</li><li><b>C.</b> Thiếu infinitive marker.</li><li><b>D.</b> Hai vế không song song.</li></ul></div>\n<div class=\"ex-step\"><b>6. Kiến thức cần nhớ</b><p><b>be careful not to V</b>; cấu trúc đối lập song song <b>not to V1 but to V2</b>.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. not to judge cheap clothing only by price but to consider its environmental impact</div>"},{"n":23,"section":5,"stem":"Question 23: In which paragraph does the writer show that convenience can feel helpful in daily life while still hiding a longer environmental cost?","options":{"A":"Paragraph 1","B":"Paragraph 3","C":"Paragraph 4","D":"Paragraph 2"},"correct":"A","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Đúng: đoạn 1 nói các lựa chọn tiện lợi tiết kiệm thời gian, bảo vệ đồ, giúp người mệt thấy được chăm sóc, nhưng packaging bắt đầu ‘a much longer journey’.</li><li><b>B.</b> Đoạn 3 nói tốc độ, quảng cáo và việc thiếu lựa chọn bền vững.</li><li><b>C.</b> Đoạn 4 đưa giải pháp thiết kế lại convenience.</li><li><b>D.</b> Đoạn 2 giải thích tính chất nhựa và hệ thống rác thải.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Đoạn nào cho thấy sự tiện lợi có thể hữu ích trong đời sống hằng ngày nhưng vẫn che giấu một chi phí môi trường kéo dài hơn?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Đoạn 1 đối lập trực tiếp <i>comfort is often brief</i> với <i>packaging begins a much longer journey</i>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn A?</b><p>A khớp đầy đủ hai vế của câu hỏi.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát đúng đoạn được hỏi, tìm từ khóa/paraphrase và tránh suy diễn vượt quá nội dung bài.</p></div>\n<div class=\"answer-line\">Đáp án đúng: A. Paragraph 1</div>"},{"n":24,"section":5,"stem":"Question 24: The word “They” in paragraph 1 refers to ______.","options":{"A":"the small daily comforts","B":"these convenient choices","C":"the school-day purchases","D":"the packaged items"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> ‘Comforts’ không phải danh từ ngay trước.</li><li><b>B.</b> Đúng: câu trước là <i>These choices do not look selfish. They save time...</i>.</li><li><b>C.</b> Quá hẹp; không chỉ hành vi mua hàng mà là các lựa chọn tiện lợi vừa nêu.</li><li><b>D.</b> Các đồ được đóng gói không phải chủ thể logic của <i>save time, protect things...</i>.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Từ <i>They</i> ở đoạn 1 thay cho đối tượng nào?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p><i>These choices do not look selfish. <b>They</b> save time...</i></p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p>Đại từ số nhiều <b>They</b> thay trực tiếp cho <b>These choices</b>.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát đúng đoạn được hỏi, tìm từ khóa/paraphrase và tránh suy diễn vượt quá nội dung bài.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. these convenient choices</div>"},{"n":25,"section":5,"stem":"Question 25: What can be inferred about plastic from paragraph 2?","options":{"A":"Plastic becomes a problem only when people use it carelessly.","B":"The useful qualities of plastic also help create waste problems that are difficult to manage.","C":"Waste systems have made single-use plastic spread faster in many places.","D":"Cheap packaging is mainly harmful because it looks clean and comfortable."},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Sai vì chính cheap/light/easy-to-make đã góp phần vào vấn đề ngay cả trước khi xét ‘careless use’.</li><li><b>B.</b> Đúng: các tính chất hữu ích khiến single-use items lan nhanh hơn khả năng quản lý của nhiều hệ thống rác.</li><li><b>C.</b> Đảo quan hệ nhân quả: plastic spread faster than waste systems can manage, không phải waste systems làm plastic lan nhanh.</li><li><b>D.</b> Đoạn 2 không nói tác hại chính là ‘looks clean and comfortable’.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Có thể suy ra điều gì về nhựa từ đoạn 2?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p><i>plastic is useful because it is cheap, light, and easy to make, but these same qualities have allowed single-use items to spread faster than many waste systems can manage</i>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p>B là suy luận trực tiếp từ cấu trúc <b>useful qualities → unintended waste problem</b>.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát đúng đoạn được hỏi, tìm từ khóa/paraphrase và tránh suy diễn vượt quá nội dung bài.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. The useful qualities of plastic also help create waste problems that are difficult to manage.</div>"},{"n":26,"section":5,"stem":"Question 26: The word “virtue” in paragraph 3 is closest in meaning to ______.","options":{"A":"public duty","B":"useful habit","C":"valued quality","D":"social skill"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> <b>public duty</b>: nghĩa vụ công cộng.</li><li><b>B.</b> <b>useful habit</b>: thói quen hữu ích.</li><li><b>C.</b> <b>valued quality</b>: phẩm chất được coi trọng, phù hợp nghĩa ‘đức tính/điều tốt’.</li><li><b>D.</b> <b>social skill</b>: kỹ năng xã hội.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Từ <i>virtue</i> ở đoạn 3 gần nghĩa nhất với từ nào?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p><i>Modern life also teaches speed as a virtue.</i> = đời sống hiện đại xem tốc độ như một phẩm chất đáng coi trọng.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>C gần nghĩa nhất.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát đúng đoạn được hỏi, tìm từ khóa/paraphrase và tránh suy diễn vượt quá nội dung bài.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. valued quality</div>"},{"n":27,"section":5,"stem":"Question 27: Which of the following best paraphrases the underlined sentence in paragraph 3?","options":{"A":"People cannot make sustainable choices when practical options are unavailable.","B":"Students avoid refill stations because packaged drinks feel more comfortable.","C":"Schools should blame students who continue to buy single-use cups.","D":"Refill stations matter less than advertisements and social media trends."},"correct":"A","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Đúng: con người không thể chọn phương án bền vững nếu phương án thực tế đó không được cung cấp.</li><li><b>B.</b> Câu gốc không nói học sinh ‘avoid’ refill station.</li><li><b>C.</b> Trái thông điệp: tác giả phản đối chỉ đổ lỗi người tiêu dùng.</li><li><b>D.</b> Không so sánh mức độ quan trọng.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Phương án nào diễn đạt lại tốt nhất câu “A student cannot use a refill station that does not exist”?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Câu gốc là ví dụ cho luận điểm rằng <b>available choices have been shaped</b> và trách nhiệm không thể chỉ đặt lên người tiêu dùng.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn A?</b><p>A khái quát chính xác ý ‘choice requires available infrastructure’.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát đúng đoạn được hỏi, tìm từ khóa/paraphrase và tránh suy diễn vượt quá nội dung bài.</p></div>\n<div class=\"answer-line\">Đáp án đúng: A. People cannot make sustainable choices when practical options are unavailable.</div>"},{"n":28,"section":5,"stem":"Question 28: The word “condemned” in paragraph 4 is OPPOSITE in meaning to ______.","options":{"A":"blamed","B":"questioned","C":"avoided","D":"accepted"},"correct":"D","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> <b>blamed</b>: bị lên án/đổ lỗi, gần nghĩa.</li><li><b>B.</b> <b>questioned</b>: bị nghi vấn, không đối nghĩa trực tiếp.</li><li><b>C.</b> <b>avoided</b>: bị tránh né.</li><li><b>D.</b> <b>accepted</b>: được chấp nhận → đối nghĩa rõ nhất.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Từ <i>condemned</i> trong đoạn 4 TRÁI NGHĨA với từ nào?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p><i>convenience is redesigned, not merely condemned</i> — condemned = bị lên án/chỉ trích.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn D?</b><p>Đối nghĩa là <b>accepted</b>.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát đúng đoạn được hỏi, tìm từ khóa/paraphrase và tránh suy diễn vượt quá nội dung bài.</p></div>\n<div class=\"answer-line\">Đáp án đúng: D. accepted</div>"},{"n":29,"section":5,"stem":"Question 29: Which of the following is NOT mentioned as a way to make sustainable choices easier?","options":{"A":"Creating reusable systems.","B":"Raising prices for single-use items.","C":"Providing honest labels.","D":"Improving collection systems."},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Có: <i>Reusable systems</i>.</li><li><b>B.</b> Không có ý tăng giá đồ dùng một lần.</li><li><b>C.</b> Có: <i>honest labels</i>.</li><li><b>D.</b> Có: <i>better collection</i>.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Ý nào KHÔNG được nhắc đến như một cách giúp lựa chọn bền vững trở nên dễ dàng hơn?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Đoạn 4 liệt kê trực tiếp <i>Reusable systems, honest labels, better collection, and refill options</i>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p>B là ý duy nhất không xuất hiện.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát đúng đoạn được hỏi, tìm từ khóa/paraphrase và tránh suy diễn vượt quá nội dung bài.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. Raising prices for single-use items.</div>"},{"n":30,"section":5,"stem":"Question 30: In which paragraph does the writer argue that comfort should be redesigned responsibly rather than simply rejected?","options":{"A":"Paragraph 1","B":"Paragraph 3","C":"Paragraph 4","D":"Paragraph 2"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Đoạn 1 mô tả mặt hữu ích và chi phí dài hạn.</li><li><b>B.</b> Đoạn 3 phân tích speed và cấu trúc lựa chọn.</li><li><b>C.</b> Đúng: đoạn 4 mở <i>The wiser question is not whether comfort should be rejected</i> và kết bằng <i>convenience is redesigned, not merely condemned</i>.</li><li><b>D.</b> Đoạn 2 nói nhựa và waste systems.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Đoạn nào cho rằng sự tiện lợi nên được thiết kế lại có trách nhiệm thay vì đơn giản bị loại bỏ?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Toàn bộ đoạn 4 tập trung giải pháp ‘design comfort’ và ‘redesign convenience’.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>C là đáp án trực tiếp.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát đúng đoạn được hỏi, tìm từ khóa/paraphrase và tránh suy diễn vượt quá nội dung bài.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. Paragraph 4</div>"},{"n":31,"section":6,"stem":"Question 31: Where in the passage does the following sentence best fit?<br><span class='insert-sentence'>Together, these small features show that health can be supported by the design of everyday public places.</span>","options":{"A":"[I]","B":"[II]","C":"[III]","D":"[IV]"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> [I] quá sớm vì chưa có các ‘small features’ cụ thể để <i>Together</i> tổng kết.</li><li><b>B.</b> [II] mới có path và playground, chưa có garden; có thể hiểu nhưng chưa tổng hợp đủ chuỗi ví dụ.</li><li><b>C.</b> Đúng: sau path, playground và garden, câu <i>Together</i> tổng kết các ví dụ rồi dẫn sang câu khái quát <i>Health is built...</i>.</li><li><b>D.</b> Nếu ở [IV], nó đứng sau câu khái quát về health, tạo lặp ý và thứ tự kém tự nhiên.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Câu “Cùng nhau, những đặc điểm nhỏ này cho thấy sức khỏe có thể được hỗ trợ bằng thiết kế của các không gian công cộng hằng ngày” nên đặt ở đâu?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Đoạn 2: câu chủ đề → ví dụ shaded path/playground/garden → [III] → câu tổng quát về health trong benches, trees, paths.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>C hoạt động như cầu nối <b>examples → general conclusion</b>.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Với câu chèn có từ <b>Together/these</b>, phải đặt sau đủ các ví dụ mà nó quy chiếu.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. [III]</div>"},{"n":32,"section":6,"stem":"Question 32: According to paragraph 1, the small park is presented as a place that ______.","options":{"A":"makes city streets quieter by reducing traffic noise","B":"makes concrete streets look more carefully designed","C":"lets people pause within a fast-moving city","D":"helps residents move through crowded streets faster"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Không có thông tin công viên giảm traffic noise.</li><li><b>B.</b> Không chỉ là decoration/design.</li><li><b>C.</b> Đúng: <i>In cities trained to move quickly, a place that lets people stay becomes more than decoration.</i></li><li><b>D.</b> Ngược ý; công viên cho phép ở lại/chậm lại, không giúp di chuyển nhanh hơn.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Theo đoạn 1, công viên nhỏ được mô tả như một nơi làm gì?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Câu cuối đoạn 1 trực tiếp nói park là nơi <b>lets people stay</b> trong thành phố di chuyển nhanh.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>C paraphrase ‘pause/stay’.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát đúng đoạn được hỏi, tìm từ khóa/paraphrase và tránh suy diễn vượt quá nội dung bài.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. lets people pause within a fast-moving city</div>"},{"n":33,"section":6,"stem":"Question 33: What can be inferred from paragraph 2 about the value of green spaces?","options":{"A":"They support health when they are close, usable, and part of daily life.","B":"They mainly improve health when they are placed in wealthy districts.","C":"They matter less than hospitals and fitness plans in shaping health.","D":"Their value depends chiefly on providing organised sports facilities."},"correct":"A","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Đúng: shaded paths, playgrounds, garden near homes và benches/trees/paths hỗ trợ sức khỏe khi gắn với đời sống thường ngày.</li><li><b>B.</b> Trái câu nói garden nên gần homes thay vì hidden in a wealthy district.</li><li><b>C.</b> Trái ý <i>Health is built not only in hospitals...</i>.</li><li><b>D.</b> Quá hẹp; đoạn không tập trung organised sports.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Có thể suy ra gì từ đoạn 2 về giá trị của không gian xanh?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Đoạn nhấn mạnh các yếu tố nhỏ, gần nhà và dễ sử dụng trong không gian hằng ngày.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn A?</b><p>A tổng hợp đúng các ví dụ.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát đúng đoạn được hỏi, tìm từ khóa/paraphrase và tránh suy diễn vượt quá nội dung bài.</p></div>\n<div class=\"answer-line\">Đáp án đúng: A. They support health when they are close, usable, and part of daily life.</div>"},{"n":34,"section":6,"stem":"Question 34: Which of the following best summarises paragraph 2?","options":{"A":"Urban greenery improves cities mainly by creating a calmer image that makes public campaigns more persuasive to residents.","B":"Green spaces work best when gardens are kept away from ordinary homes and placed in quiet districts for careful use.","C":"Public health should depend more on hospitals and fitness plans than on everyday features such as benches and paths.","D":"Green spaces support everyday health by making movement, rest, stress relief, and social contact easier within ordinary city life."},"correct":"D","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Tập trung image/public campaigns, thuộc đoạn 3 chứ không phải đoạn 2.</li><li><b>B.</b> Trái nội dung garden near homes.</li><li><b>C.</b> Trái câu <i>not only in hospitals or fitness plans</i>.</li><li><b>D.</b> Đúng: path giúp đi bộ, playground kéo trẻ khỏi màn hình, garden giảm stress/kết nối hàng xóm, benches/trees hỗ trợ chậm lại.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Phương án nào tóm tắt đoạn 2 tốt nhất?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Đoạn 2 liệt kê nhiều cơ chế sức khỏe thể chất, tinh thần và xã hội trong đời sống đô thị hằng ngày.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn D?</b><p>D bao quát toàn đoạn.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát đúng đoạn được hỏi, tìm từ khóa/paraphrase và tránh suy diễn vượt quá nội dung bài.</p></div>\n<div class=\"answer-line\">Đáp án đúng: D. Green spaces support everyday health by making movement, rest, stress relief, and social contact easier within ordinary city life.</div>"},{"n":35,"section":6,"stem":"Question 35: The word “them” in paragraph 3 refers to ______.","options":{"A":"local green areas","B":"nearby spaces","C":"advertised parks","D":"wealthy districts"},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> ‘local green areas’ không phải cụm xuất hiện trực tiếp ngay trước.</li><li><b>B.</b> Đúng: <i>nearby spaces remain poorly lit, neglected, or too far from those who need them most</i>.</li><li><b>C.</b> Glossy riverside park là số ít, không phù hợp <i>them</i>.</li><li><b>D.</b> Không phải đối tượng được ‘need’.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Từ <i>them</i> ở đoạn 3 thay cho gì?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Antecedent gần nhất và phù hợp số nhiều là <b>nearby spaces</b>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p>B đúng quy chiếu đại từ.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát đúng đoạn được hỏi, tìm từ khóa/paraphrase và tránh suy diễn vượt quá nội dung bài.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. nearby spaces</div>"},{"n":36,"section":6,"stem":"Question 36: The word “glossy” in paragraph 3 is closest in meaning to ______.","options":{"A":"distant","B":"simple","C":"attractive","D":"crowded"},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> <b>distant</b>: xa.</li><li><b>B.</b> <b>simple</b>: đơn giản.</li><li><b>C.</b> <b>attractive</b>: bóng bẩy, hấp dẫn về hình ảnh; phù hợp quảng cáo.</li><li><b>D.</b> <b>crowded</b>: đông đúc.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Từ <i>glossy</i> trong đoạn 3 gần nghĩa nhất với từ nào?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p><i>a glossy riverside park appears in an advertisement</i> — glossy mang sắc thái hình ảnh được đánh bóng, đẹp hấp dẫn.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>C gần nghĩa nhất trong các lựa chọn.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát đúng đoạn được hỏi, tìm từ khóa/paraphrase và tránh suy diễn vượt quá nội dung bài.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. attractive</div>"},{"n":37,"section":6,"stem":"Question 37: Which of the following is NOT mentioned as a task that matters after a green space is opened?","options":{"A":"Keeping walkways clean","B":"Fixing lighting problems","C":"Taking care of young trees","D":"Lowering local rents"},"correct":"D","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Có: <i>who cleans the paths</i>.</li><li><b>B.</b> Có: <i>repairs the lights</i>.</li><li><b>C.</b> Có: <i>waters the trees</i>, tức chăm sóc cây.</li><li><b>D.</b> Không có nhiệm vụ giảm giá thuê nhà.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Nhiệm vụ nào KHÔNG được nhắc đến như việc quan trọng sau khi không gian xanh mở cửa?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Đoạn 4 liệt kê cleaning paths, repairing lights, watering trees, keeping gates open.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn D?</b><p>D không nằm trong danh sách.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát đúng đoạn được hỏi, tìm từ khóa/paraphrase và tránh suy diễn vượt quá nội dung bài.</p></div>\n<div class=\"answer-line\">Đáp án đúng: D. Lowering local rents</div>"},{"n":38,"section":6,"stem":"Question 38: Which of the following best paraphrases the underlined sentence in paragraph 4?","options":{"A":"Good green spaces let people take part in sustainable living instead of merely looking at it.","B":"Good green spaces are valuable mainly because they help people admire the city from far away.","C":"Good green spaces should be protected from daily use so that their beauty can be maintained.","D":"Good green spaces turn sustainability into a polished image that people can enjoy visually."},"correct":"A","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Đúng: greenery tốt cho phép người dân sống/tham gia bên trong tính bền vững, không chỉ ngắm từ xa; câu sau còn nói <i>It gives them a place inside it</i>.</li><li><b>B.</b> Trái nghĩa ‘does not ask people to admire ... from a distance’.</li><li><b>C.</b> Trái ý use/access.</li><li><b>D.</b> Đây chính là kiểu ‘polished promise’ bài cảnh báo.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Phương án nào diễn đạt lại tốt nhất câu “Good greenery does not ask people to admire sustainability from a distance”?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Underlined sentence + câu sau tạo cặp: không chỉ nhìn từ xa → có một chỗ ở bên trong.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn A?</b><p>A là paraphrase đầy đủ nhất.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát đúng đoạn được hỏi, tìm từ khóa/paraphrase và tránh suy diễn vượt quá nội dung bài.</p></div>\n<div class=\"answer-line\">Đáp án đúng: A. Good green spaces let people take part in sustainable living instead of merely looking at it.</div>"},{"n":39,"section":6,"stem":"Question 39: Which of the following can be inferred from the passage?","options":{"A":"Green spaces should be judged mainly by how attractive they look in public campaigns and advertisements.","B":"Green spaces improve cities most when access, long-term care, and social fairness are treated as connected goals.","C":"Cleaner air and physical activity are enough to make a park socially successful for nearby residents.","D":"Urban parks can serve residents well even when long-term care is treated as a later detail."},"correct":"B","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Trái đoạn 3 phê phán glossy image.</li><li><b>B.</b> Đúng: đoạn 2 nhấn mạnh access gần nhà; đoạn 3 cảnh báo bất công/gentrification; đoạn 4 nhấn mạnh maintenance lâu dài.</li><li><b>C.</b> Quá hẹp; social contact, mental health và fairness cũng quan trọng.</li><li><b>D.</b> Trái đoạn 4: ‘harder test comes after the ribbon is cut’ — chăm sóc dài hạn là cốt lõi.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Có thể suy ra điều gì từ toàn bài?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Ba mạch xuyên suốt là <b>usable access + social fairness + ongoing maintenance</b>.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn B?</b><p>B kết nối đúng các điều kiện để park thật sự có ích.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát đúng đoạn được hỏi, tìm từ khóa/paraphrase và tránh suy diễn vượt quá nội dung bài.</p></div>\n<div class=\"answer-line\">Đáp án đúng: B. Green spaces improve cities most when access, long-term care, and social fairness are treated as connected goals.</div>"},{"n":40,"section":6,"stem":"Question 40: Which of the following best summarises the passage?","options":{"A":"Urban greenery is valuable because it gives city residents places to exercise and rest while helping them escape wider public problems in crowded cities.","B":"Building more parks is the main solution because green spaces naturally improve health and create social equality without the need for further planning.","C":"Green spaces can improve urban life, but they must remain accessible, well maintained, and socially fair rather than merely decorative urban features.","D":"Parks can make cities calmer, but the passage mainly presents them as tools for creating a cleaner public image of urban development."},"correct":"C","explanation":"<h4>PHẦN GIẢI THÍCH CHI TIẾT</h4>\n<div class=\"ex-step\"><b>1. Phân tích 4 đáp án</b><ul><li><b>A.</b> Đúng một phần về exercise/rest nhưng bỏ access, maintenance, inequality và image problem.</li><li><b>B.</b> Sai vì bài nhấn mạnh cần planning, maintenance và social fairness; parks không tự động tạo bình đẳng.</li><li><b>C.</b> Đúng: bao quát lợi ích, access, chăm sóc lâu dài, công bằng xã hội và cảnh báo chống biến greenery thành decoration/image.</li><li><b>D.</b> Đảo trọng tâm; bài phê phán việc dùng park như public image.</li></ul></div>\n<div class=\"ex-step\"><b>2. Dịch câu hỏi</b><p>Phương án nào tóm tắt toàn bài tốt nhất?</p></div>\n<div class=\"ex-step\"><b>3. Bằng chứng trong bài</b><p>Toàn bài đi từ lợi ích đời thường → điều kiện tiếp cận → nguy cơ ‘glossy’/gentrification → trách nhiệm chăm sóc lâu dài.</p></div>\n<div class=\"ex-step\"><b>4. Tại sao chọn C?</b><p>C là tóm tắt cân bằng và đầy đủ nhất.</p></div>\n<div class=\"ex-step\"><b>5. Kiến thức / chiến thuật cần nhớ</b><p>Bám sát đúng đoạn được hỏi, tìm từ khóa/paraphrase và tránh suy diễn vượt quá nội dung bài.</p></div>\n<div class=\"answer-line\">Đáp án đúng: C. Green spaces can improve urban life, but they must remain accessible, well maintained, and socially fair rather than merely decorative urban features.</div>"}];
const SOURCES={"1":"\n<div class=\"paper-instruction\">Read the following advertisement and mark the letter A, B, C, or D on your answer sheet to indicate the option that best fits each of the numbered blanks from 1 to 6.</div>\n<h2>Single-Use Plastics: Ban Them Completely?</h2>\n<p>Single-use plastics are used in many areas of daily life because they are cheap and convenient. However, growing environmental <b>(1) ______</b> have led many people to question whether these products should be banned completely. The issue remains widely discussed by students, consumers, and policymakers.</p>\n<p>Some arguments in favour of a ban include:</p>\n<ul>\n<li>The amount of plastic waste in rivers and oceans has increased significantly in recent years.</li>\n<li>Environmental groups suggest <b>(2) ______</b> the use of disposable products whenever possible.</li>\n<li>Plastic waste often ends up in natural areas, leading <b>(3) ______</b> serious damage to wildlife.</li>\n<li>Governments can encourage the use of products that are <b>(4) ______</b> than single-use plastics.</li>\n</ul>\n<p>Others argue that a complete ban may be difficult to implement immediately. Instead, both governments and citizens should <b>(5) ______</b> responsibility for reducing waste. Long-term solutions supported by campaigns <b>(6) ______</b> aim to reduce plastic waste may help create lasting change.</p>\n","2":"\n<div class=\"paper-instruction\">Read the following leaflet and mark the letter A, B, C or D on your answer sheet to indicate the option that best fits each of the numbered blanks from 7 to 12.</div>\n<h2>Eco-Tourism: Protecting Nature or Destroying It?</h2>\n<h3>Problem</h3>\n<p>Eco-tourism is often seen as a responsible way to explore nature. However, when visitor numbers grow quickly, it can create serious environmental problems if it is not managed carefully.</p>\n<p><b>(7) ______</b> visitor numbers continue to increase at the current rate, natural areas will eventually experience serious environmental pressure. It is high time local authorities <b>(8) ______</b> visitor numbers before noise, litter, and overcrowding damage local habitats.</p>\n<p>Wildlife may also be affected. Of the four tour groups visiting the area, two follow environmental guidelines carefully, while protected areas are sometimes <b>(9) ______</b> by the others.</p>\n<h3>Solutions</h3>\n<p>To reduce these impacts, local authorities regularly examine concerns raised by local people and conservation groups. They also <b>(10) ______</b> complaints about tourism activities before introducing new rules. Education programmes and visitor limits can help protect natural <b>(11) ______</b> where animals live and plants grow.</p>\n<p>In the future, eco-tourism will only remain successful if travellers develop a stronger commitment to environmental <b>(12) ______</b>.</p>\n","4":"\n<div class=\"paper-instruction\">Read the following passage and mark the letter A, B, C or D on your answer sheet to indicate the option that best fits each of the numbered blanks from 18 to 22.</div>\n<p>Among the contradictions of fast fashion, one deserves particular attention: the cheapest clothes often carry costs that are not printed on the price tag. When a new T-shirt costs less than lunch, its low price may lead to <b>(18) ______</b>. Closer inspection often tells a different story. Many low-priced garments are made from synthetic materials, <b>(19) ______</b>. The price may look small at checkout, yet water, energy, harmful chemicals, and labour have already been used before the item reaches a shop. <b>(20) ______</b>.</p>\n<p>We tend to judge clothes by what we can see because style, colour, and discounts are the easiest evidence available. We cannot see wastewater from dyeing, greenhouse gas emissions from transport, or textile waste created when clothes are worn only a few times, <b>(21) ______</b>. Fast fashion has turned quick replacement into a normal habit, packaging constant novelty as affordability. However, more sustainable fashion often hides in the item repaired, the used item donated, the garment kept for another season, and the unnecessary purchase refused.</p>\n<p>In short, a bargain is not always sustainable simply because it saves money at the checkout. Consumers should therefore be careful <b>(22) ______</b> when deciding whether a garment is truly sustainable; otherwise, mistaking low price for low impact can lead to more waste, not better choices.</p>\n","5":"\n<div class=\"paper-instruction\">Read the passage and mark the letter A, B, C or D on your answer sheet to indicate the best answer to each of the following questions from 23 to 30.</div>\n<h2>Are We Sacrificing Sustainability for Comfort?</h2>\n<p><b>1.</b> At the end of a school day, convenience can feel generous. A cold drink comes in a cup, noodles arrive in a clean box, and a plastic bag keeps a wet umbrella away from books. These choices do not look selfish. <u><b>They</b></u> save time, protect things, and make tired people feel looked after. Yet the comfort is often brief, while the packaging begins a much longer journey.</p>\n<p><b>2.</b> UNEP notes that plastic is useful because it is cheap, light, and easy to make, but these same qualities have allowed single-use items to spread faster than many waste systems can manage. This is the quiet cost hidden inside convenience. A cup held for minutes may remain in drains, landfills, or rivers for years. Not every easy choice is careless, but every easy choice has a background, often carried by places and people we rarely see.</p>\n<p><b>3.</b> Modern life also teaches speed as a <u><b>virtue</b></u>. Advertisements make instant delivery look tidy and caring, while social media turns neat packaging into part of a comfortable lifestyle. Then public talk often blames consumers for creating waste, even when available choices have been shaped for quick use and quick disposal. <u><b>A student cannot use a refill station that does not exist.</b></u> A parent coming home late may buy packaged food because time, money, and energy are limited.</p>\n<p><b>4.</b> The wiser question is not whether comfort should be rejected. Comfort matters, especially to those worn down by work, heat, traffic, or family pressure. The challenge is to design comfort that does not quietly move its burden onto rivers, waste workers, or children who will inherit the mess. Reusable systems, honest labels, better collection, and refill options can make sustainable choices less heroic. Only when convenience is redesigned, not merely <u><b>condemned</b></u>, can comfort become part of a responsible life.</p>\n<p class=\"source-note\">[Adapted from<br><u><b>https://www.unep.org/resources/report/single-use-plastics-roadmap-sustainability</b></u>]</p>\n","6":"\n<div class=\"paper-instruction\">Read the passage and mark the letter A, B, C or D on your answer sheet to indicate the best answer to each of the following questions from 31 to 40.</div>\n<h2>Can Green Spaces Improve Urban Life?</h2>\n<p><b>1.</b> From an apartment balcony, a patch of colour appears in the middle of concrete. Children run under young trees, office workers eat lunch on the steps, and an old man sits with a quiet radio. Only later is it clear that this small park does more than fill space. Nothing dramatic happens there. That is partly the point. In cities trained to move quickly, a place that lets people stay becomes more than decoration.</p>\n<p><b>2.</b> Green spaces improve urban life because they work through ordinary bodies. <b>[I]</b> A shaded path makes walking less tiring. A playground can pull children away from screens. <b>[II]</b> A garden, placed near homes rather than hidden in a wealthy district, can reduce stress and make neighbours visible to one another. <b>[III]</b> Health is built not only in hospitals or fitness plans, but also into benches, trees, paths, and the quiet permission to slow down. <b>[IV]</b></p>\n<p><b>3.</b> The problem begins when greenery is asked to do the work of an image. Public campaigns can help people imagine cleaner, calmer city life. But the same images can also sell aspiration: a <u><b>glossy</b></u> riverside park appears in an advertisement while nearby spaces remain poorly lit, neglected, or too far from those who need <u><b>them</b></u> most. New parks can make an area attractive, then more expensive, leaving long-time residents unsure whether the improvement was truly meant for them. A park can heal a neighbourhood, or become a sign that it is being prepared for someone else.</p>\n<p><b>4.</b> The better question is not whether cities need more green spaces. They do. The harder test comes after the ribbon is cut: who cleans the paths, repairs the lights, waters the trees, and keeps the gates open without making it private scenery? Planned with care, parks can support physical activity, mental health, cleaner air, and social contact without becoming another polished promise. <u><b>Good greenery does not ask people to admire sustainability from a distance.</b></u> It gives them a place inside it.</p>\n<p class=\"source-note\">[Adapted from<br><u><b>https://www.who.int/europe/publications/i/item/WHO-EURO-2016-3352-43111-60341</b></u>]</p>\n"};
